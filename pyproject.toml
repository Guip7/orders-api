[project]
name = "orders-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["app"]